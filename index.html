<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Renovando nossa identidade</title>
<style>
  :root { --bg:#f7f9fb; --card:#ffffff; --text:#1c2733; --muted:#5a6775; --accent:#1f6f5c; --line:#dde4ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121a21; --card:#1a252e; --text:#eaf0f5; --muted:#a3b0bc; --accent:#5fc4a8; --line:#2b3945; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
         background:var(--bg); color:var(--text); font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; line-height:1.6; }
  main { max-width:520px; width:100%; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:32px 28px; }
  h1 { font-size:1.6rem; line-height:1.25; margin:0 0 16px; }
  p { margin:0 0 14px; color:var(--muted); font-size:1.02rem; }
  a.btn { display:inline-block; margin-top:8px; padding:14px 22px; background:var(--accent); color:#fff; text-decoration:none;
          border-radius:10px; font-weight:600; }
  a.btn:focus-visible { outline:3px solid var(--text); outline-offset:3px; }
  @media (prefers-color-scheme: dark) { a.btn { color:#0b1a15; } }
</style>
</head>
<body>
<main>
  <h1>Estamos renovando nossa identidade</h1>
  <p>Nosso site está temporariamente fora do ar para atualização de nome e identidade visual. Voltamos em breve com novidades.</p>
  <p>Já adquiriu o kit ou tem dúvidas? Fale com a gente pelo WhatsApp.</p>
  <a class="btn" href="https://wa.me/5518981950799?text=Ol%C3%A1%21%20Tenho%20uma%20d%C3%BAvida%20sobre%20o%20meu%20kit.">Falar no WhatsApp</a>
</main>
</body>
</html>
