<body>
<header><h1>QR ZAPE BRASIL</h1><p>Kit Digital R$100 - Comunicação Acessível</p></header>
<div class="card">
<label>Nome da Empresa</label><input id="empresa" value="Nome da Empresa" oninput="gerar()">
<label>WhatsApp com 55</label><input id="numero" value="551881670564" oninput="gerar()">
<label>Mensagem padrão</label><textarea id="msg" rows="2" oninput="gerar()">Olá! Estou neste estabelecimento e prefiro me comunicar por mensagem.</textarea>
<button class="btn btn-roxo" onclick="gerar()">GERAR KIT</button>
<div class="qr-box">
<img id="qr" style="width:220px;height:220px;background:#fff;padding:6px;border-radius:8px">
<div id="linkTxt" style="font-size:9px;color:#777;word-break:break-all;margin-top:8px"></div>
<div class="row"><button class="btn btn-cinza" onclick="copiar()">Copiar Link</button><button class="btn btn-verde" onclick="baixarQR()">Baixar QR</button></div>
<button class="btn btn-cinza" onclick="imprimirQR()">🖨️ IMPRIMIR QR CODE</button>
</div>
</div>

<div class="card"><h3 style="color:#6A2FB5">1. CERTIFICADO OFICIAL</h3><div class="cert-wrap"><img id="certBase" src="certificado-base.png"><div id="certNome" class="cert-nome">Nome da Empresa</div></div><div class="row"><button class="btn btn-verde" onclick="baixarCert()">Baixar Certificado</button><button class="btn btn-azul" onclick="imprimirCertificado()">Imprimir Certificado</button></div></div>

<div class="card"><h3 style="color:#6A2FB5">2. SELO OFICIAL</h3><div style="text-align:center"><img id="seloBase" src="selo-base.png" style="width:100%;max-width:380px"></div><div class="row"><button class="btn btn-cinza" onclick="baixarSelo()">Baixar Selo</button><button class="btn btn-cinza" onclick="imprimirSelo()">🖨️ Imprimir Selo</button></div></div>

<div class="card"><h3 style="color:#6A2FB5">3. ADESIVO PORTA/BALCÃO</h3><div class="adesivo-outer"><div class="adesivo-inner"><img id="adesivoBase" class="base" src="adesivo-porta-base.png"><img id="qr2" class="adesivo-qr"></div></div><div class="row"><button class="btn btn-verde" onclick="baixarAdesivo()">Baixar Adesivo</button><button class="btn btn-cinza" onclick="imprimirAdesivo()">🖨️ Imprimir Adesivo</button></div></div>

<div class="card"><h3 style="color:#1e5aa8">4. QR AZUL REDONDO</h3><div class="qr-azul-wrap"><img id="qrAzulBase" class="base" src="qr-azul-base.png"><img id="qr3" class="qr-azul-qr"></div><div class="row"><button class="btn btn-azul" onclick="baixarQrAzul()">Baixar QR Azul</button><button class="btn btn-cinza" onclick="imprimirQrAzul()">🖨️ Imprimir QR Azul</button></div></div>

<canvas id="cv" style="display:none"></canvas><div id="qrTemp" style="position:absolute;left:-9999px"></div>
<script>
let longUrl="",qrBlackDataUrl="",qrBlueDataUrl="";
function loadImage(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
function downloadDataUrl(d,f){const a=document.createElement('a');a.href=d;a.download=f;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),150);}
function printDataUrl(d,t){const w=window.open('','_blank');w.document.write(`<html><head><title>${t}</title><style>body{margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#fff}img{max-width:95%;max-height:95vh}</style></head><body><img src="${d}" onload="setTimeout(()=>{window.print();},300)"></body></html>`);w.document.close();}
function makeQR(text,color,size){
  const div=document.getElementById('qrTemp');div.innerHTML="";
  new QRCode(div,{text:text,width:size,height:size,colorDark:color,colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.H});
  const canvas=div.querySelector('canvas');if(canvas) return canvas.toDataURL();
  const table=div.querySelector('table');if(!table) return null;
  const c=document.createElement('canvas');c.width=size;c.height=size;const ctx=c.getContext('2d');const rows=table.rows.length;const cw=size/rows;
  for(let r=0;r<rows;r++){for(let cc=0;cc<table.rows[r].cells.length;cc++){ctx.fillStyle=table.rows[r].cells[cc].style.backgroundColor;ctx.fillRect(cc*cw,r*cw,cw,cw);}}
  return c.toDataURL();
}
function gerar(){
  let emp=document.getElementById('empresa').value||'Nome da Empresa';
  let num=document.getElementById('numero').value.replace(/\D/g,'');
  let msg=document.getElementById('msg').value;
  longUrl=`https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
  document.getElementById('linkTxt').innerText=longUrl;
  document.getElementById('certNome').innerText=emp;
  let f=emp.length>28?22:emp.length>20?26:30;document.getElementById('certNome').style.fontSize=f+'px';
  qrBlackDataUrl=makeQR(longUrl,'#000000',600);
  qrBlueDataUrl=makeQR(longUrl,'#1e5aa8',600);
  if(qrBlackDataUrl){document.getElementById('qr').src=qrBlackDataUrl;document.getElementById('qr2').src=qrBlackDataUrl;}
  if(qrBlueDataUrl) document.getElementById('qr3').src=qrBlueDataUrl;
}
function copiar(){if(!longUrl)return;navigator.clipboard.writeText(longUrl).then(()=>alert('Link copiado!'));}
function baixarQR(){if(!qrBlackDataUrl)return;downloadDataUrl(qrBlackDataUrl,'QR-CODE.png');}
async function gerarCertificadoDataUrl(){const emp=document.getElementById('empresa').value||'Empresa';const b=await loadImage(document.getElementById('certBase').src);const c=document.getElementById('cv');c.width=2400;c.height=1680;const x=c.getContext('2d');x.drawImage(b,0,0,c.width,c.height);let fs=emp.length>28?58:emp.length>20?72:84;x.fillStyle='#4b1f9c';x.font='bold '+fs+'px "Brush Script MT", cursive';x.textAlign='center';x.textBaseline='middle';x.fillText(emp,c.width/2,c.height*0.418);return c.toDataURL();}
async function baixarCert(){const d=await gerarCertificadoDataUrl();downloadDataUrl(d,'CERTIFICADO.png');}
async function gerarSeloDataUrl(){const b=await loadImage(document.getElementById('seloBase').src);const c=document.getElementById('cv');c.width=b.naturalWidth||800;c.height=b.naturalHeight||800;const x=c.getContext('2d');x.drawImage(b,0,0,c.width,c.height);return c.toDataURL();}
async function baixarSelo(){const d=await gerarSeloDataUrl();downloadDataUrl(d,'SELO-OFICIAL.png');}
async function gerarAdesivoDataUrl(){const b=await loadImage(document.getElementById('adesivoBase').src);const q=await loadImage(qrBlackDataUrl);const c=document.getElementById('cv');c.width=2000;c.height=1130;const x=c.getContext('2d');x.drawImage(b,0,0,c.width,c.height);x.drawImage(q,c.width*0.751,c.height*0.205,c.width*0.192,c.height*0.34);return c.toDataURL();}
async function baixarAdesivo(){const d=await gerarAdesivoDataUrl();downloadDataUrl(d,'ADESIVO-PORTA.png');}
async function gerarQrAzulDataUrl(){const b=await loadImage(document.getElementById('qrAzulBase').src);const q=await loadImage(qrBlueDataUrl);const c=document.getElementById('cv');c.width=1000;c.height=1000;const x=c.getContext('2d');x.drawImage(b,0,0,c.width,c.height);x.drawImage(q,c.width*0.33,c.height*0.33,c.width*0.34,c.height*0.34);return c.toDataURL();}
async function baixarQrAzul(){const d=await gerarQrAzulDataUrl();downloadDataUrl(d,'QR-AZUL.png');}
function imprimirQR(){printDataUrl(qrBlackDataUrl,'QR CODE');}
function imprimirCertificado(){gerarCertificadoDataUrl().then(d=>printDataUrl(d,'CERTIFICADO'));}
function imprimirSelo(){gerarSeloDataUrl().then(d=>printDataUrl(d,'SELO'));}
function imprimirAdesivo(){gerarAdesivoDataUrl().then(d=>printDataUrl(d,'ADESIVO'));}
function imprimirQrAzul(){gerarQrAzulDataUrl().then(d=>printDataUrl(d,'QR AZUL'));}
window.addEventListener('load',gerar);gerar();
</script>
</body>
</html>
