<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>BrocheZap - Kit Oficial</title><style>*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#f5f0ff}header{background:#6A2FB5;color:#fff;padding:12px;text-align:center}header b{display:block;font-size:16px}header small{display:block;font-size:11px;opacity:.9;margin-top:3px}.card{background:#fff;margin:12px;padding:14px;border-radius:14px;border:1.5px solid #e9e0ff;overflow:hidden}label{font-size:11px;font-weight:800;color:#6A2FB5;display:block;margin-top:10px}input,textarea{width:100%;padding:12px;border:1.5px solid #ddd;border-radius:10px;margin-top:4px}.btn{padding:13px;border:0;border-radius:10px;width:100%;font-weight:900;cursor:pointer;margin-top:8px}.btn-roxo{background:#6A2FB5;color:#fff}.btn-verde{background:#00B894;color:#fff}.btn-cinza{background:#eee;color:#333}.btn-azul{background:#1e5aa8;color:#fff}.qr-box{border:2px dashed #6A2FB5;border-radius:12px;padding:12px;text-align:center;background:#faf8ff;margin-top:12px}.row{display:flex;gap:8px;margin-top:8px}.cert-wrap{position:relative;max-width:800px;margin:0 auto;background:#fff}.cert-wrap img{width:100%;display:block;border-radius:8px}.cert-nome{position:absolute;top:41.8%;left:50%;transform:translate(-50%,-50%);width:70%;font-family:'Brush Script MT',cursive;font-size:38px;font-weight:bold;color:#4b1f9c;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:10}.adesivo-outer{text-align:center;padding:10px}.adesivo-inner{position:relative;display:inline-block;max-width:800px;width:100%}.adesivo-inner .base{width:100%;display:block;border-radius:8px}.adesivo-qr{position:absolute;top:50.5%;right:7.8%;transform:translateY(-50%);width:19.2%;background:#fff}.qr-azul-wrap{position:relative;width:320px;height:320px;margin:0 auto}.qr-azul-wrap .base{width:100%;height:100%;object-fit:contain;display:block}.qr-azul-qr{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:34%;height:34%;background:#fff;padding:2px}</style><script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script></head><body><header><b>QR ZAP - Kit Digital R$100</b><small>Você implanta comunicação acessível. O QR é só a ferramenta.</small></header><div class="card"><label>Nome da Empresa</label><input id="empresa" value="Nome da Empresa" oninput="gerar()"><label>WhatsApp com 55</label><input id="numero" value="551881670564" oninput="gerar()"><label>Mensagem</label><textarea id="msg" rows="2" oninput="gerar()">Olá! Estou neste estabelecimento e prefiro me comunicar por mensagem.</textarea><button class="btn btn-roxo" onclick="gerar()">GERAR KIT ORIGINAL</button><div class="qr-box"><img id="qr" style="width:220px;height:220px;background:#fff;padding:6px;border-radius:8px"><br><span id="linkTxt" style="font-size:8px;color:#777;word-break:break-all;display:block;margin-top:6px"></span><div class="row"><button class="btn btn-cinza" onclick="copiar()">Copiar Link</button><button class="btn btn-verde" onclick="baixarQR()">Baixar QR</button></div><button class="btn btn-cinza" onclick="imprimirQR()">🖨️ IMPRIMIR QR CODE</button></div></div><div class="card"><h3 style="color:#6A2FB5;margin:0 0 8px 0">1. CERTIFICADO OFICIAL</h3><div class="cert-wrap"><img id="certBase" src="certificado-base.png"><div id="certNome" class="cert-nome">Nome da Empresa</div></div><div class="row"><button class="btn btn-verde" onclick="baixarCert()">Baixar Certificado</button><button class="btn btn-azul" onclick="imprimirCertificado()">Imprimir Certificado</button></div></div><div class="card"><h3 style="color:#6A2FB5;margin:0 0 8px 0">2. SELO OFICIAL</h3><div style="text-align:center"><img id="seloBase" src="selo-base.png" style="width:100%;max-width:380px"></div><div class="row"><button class="btn btn-cinza" onclick="baixarSelo()">Baixar Selo</button><button class="btn btn-cinza" onclick="imprimirSelo()">🖨️ Imprimir Selo</button></div></div><div class="card"><h3 style="color:#6A2FB5;margin:0 0 8px 0">3. ADESIVO PORTA/BALCÃO</h3><div class="adesivo-outer"><div class="adesivo-inner"><img id="adesivoBase" class="base" src="adesivo-porta-base.png"><img id="qr2" class="adesivo-qr"></div></div><div class="row"><button class="btn btn-verde" onclick="baixarAdesivo()">Baixar Adesivo</button><button class="btn btn-cinza" onclick="imprimirAdesivo()">🖨️ Imprimir Adesivo</button></div></div><div class="card"><h3 style="color:#1e5aa8;margin:0 0 8px 0">4. QR AZUL REDONDO</h3><div class="qr-azul-wrap"><img id="qrAzulBase" class="base" src="qr-azul-base.png"><img id="qr3" class="qr-azul-qr"></div><div class="row"><button class="btn btn-azul" onclick="baixarQrAzul()">Baixar QR Azul</button><button class="btn btn-cinza" onclick="imprimirQrAzul()">🖨️ Imprimir QR Azul</button></div></div><canvas id="cv" style="display:none"></canvas><script>
let longUrl="";let qrBlackDataUrl="";let qrBlueDataUrl="";
function loadImage(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
function downloadDataUrl(d,f){const a=document.createElement('a');a.href=d;a.download=f;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),150);}
function printDataUrl(d,t){const w=window.open('','_blank');if(!w){window.open(d,'_blank');return;}w.document.write(`<html><head><title>${t}</title><style>body{margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#fff}img{max-width:100%;max-height:100vh}</style></head><body><img src="${d}" onload="setTimeout(()=>window.print(),200)"></body></html>`);w.document.close();}

async function gerar(){
  let emp=document.getElementById('empresa').value||'Nome da Empresa';
  let num=document.getElementById('numero').value.replace(/\D/g,'');
  let msg=document.getElementById('msg').value;
  longUrl=`https://wa.me/${num}?text=${encodeURIComponent(msg)}`;
  document.getElementById('linkTxt').innerText=longUrl;
  document.getElementById('certNome').innerText=emp;
  let f=emp.length>28?22:emp.length>20?26:30;
  document.getElementById('certNome').style.fontSize=f+'px';

  await QRCode.toDataURL(longUrl,{
      width:600,
      margin:1,
      color:{dark:"#000000",light:"#ffffff"}
  }).then(url=>{
      qrBlackDataUrl=url;
      document.getElementById("qr").src=url;
      document.getElementById("qr2").src=url;
  });

  await QRCode.toDataURL(longUrl,{
      width:600,
      margin:1,
      color:{dark:"#1e5aa8",light:"#ffffff"}
  }).then(url=>{
      qrBlueDataUrl=url;
      document.getElementById("qr3").src=url;
  });
}

function copiar(){navigator.clipboard.writeText(longUrl).then(()=>alert('Copiado!')).catch(()=>{const t=document.createElement('textarea');t.value=longUrl;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();alert('Copiado!');});}
function baixarQR(){if(!qrBlackDataUrl)return alert('Gere o kit');downloadDataUrl(qrBlackDataUrl,'QR-CODE.png');}
async function gerarCertificadoDataUrl(){const emp=document.getElementById('empresa').value||'Empresa';const b=await loadImage(document.getElementById('certBase').src);const c=document.getElementById('cv');c.width=2400;c.height=1680;const x=c.getContext('2d');x.drawImage(b,0,0,c.width,c.height);let fs=emp.length>28?58:emp.length>20?72:84;x.fillStyle='#4b1f9c';x.font='bold '+fs+'px "Brush Script MT", cursive';x.textAlign='center';x.textBaseline='middle';x.fillText(emp,c.width/2,c.height*0.418);return c.toDataURL('image/png');}
async function baixarCert(){try{const d=await gerarCertificadoDataUrl();downloadDataUrl(d,'CERTIFICADO-'+(document.getElementById('empresa').value||'empresa')+'.png');}catch(e){alert('Erro certificado');}}
async function gerarSeloDataUrl(){const b=await loadImage(document.getElementById('seloBase').src);const c=document.getElementById('cv');c.width=b.naturalWidth||1024;c.height=b.naturalHeight||1024;const x=c.getContext('2d');x.drawImage(b,0,0,c.width,c.height);return c.toDataURL();}
async function baixarSelo(){const d=await gerarSeloDataUrl();downloadDataUrl(d,'SELO-OFICIAL.png');}
async function gerarAdesivoDataUrl(){const b=await loadImage(document.getElementById('adesivoBase').src);const q=await loadImage(qrBlackDataUrl);const c=document.getElementById('cv');c.width=2000;c.height=1130;const x=c.getContext('2d');x.drawImage(b,0,0,c.width,c.height);x.drawImage(q,c.width*0.751,c.height*0.205,c.width*0.192,c.height*0.34);return c.toDataURL();}
async function baixarAdesivo(){const d=await gerarAdesivoDataUrl();downloadDataUrl(d,'ADESIVO-PORTA.png');}
async function gerarQrAzulDataUrl(){const b=await loadImage(document.getElementById('qrAzulBase').src);const q=await loadImage(qrBlueDataUrl);const c=document.getElementById('cv');c.width=1000;c.height=1000;const x=c.getContext('2d');x.drawImage(b,0,0,c.width,c.height);x.drawImage(q,c.width*0.33,c.height*0.33,c.width*0.34,c.height*0.34);return c.toDataURL();}
async function baixarQrAzul(){const d=await gerarQrAzulDataUrl();downloadDataUrl(d,'QR-AZUL.png');}
function imprimirQR(){printDataUrl(qrBlackDataUrl,'QR CODE');}
function imprimirCertificado(){const w=window.open('','_blank');gerarCertificadoDataUrl().then(d=>{w.document.write(`<html><head><title>Certificado</title><style>body{margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh}img{max-width:100%;max-height:100vh}</style></head><body><img src="${d}" onload="setTimeout(()=>print(),200)"></body></html>`);w.document.close();});}
function imprimirSelo(){const w=window.open('','_blank');gerarSeloDataUrl().then(d=>{w.document.write(`<html><head><title>Selo</title><style>body{margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh}img{max-width:90%;max-height:90vh}</style></head><body><img src="${d}" onload="setTimeout(()=>print(),200)"></body></html>`);w.document.close();});}
function imprimirAdesivo(){const w=window.open('','_blank');gerarAdesivoDataUrl().then(d=>{w.document.write(`<html><head><title>Adesivo</title><style>body{margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh}img{width:100%}</style></head><body><img src="${d}" onload="setTimeout(()=>print(),200)"></body></html>`);w.document.close();});}
function imprimirQrAzul(){const w=window.open('','_blank');gerarQrAzulDataUrl().then(d=>{w.document.write(`<html><head><title>QR Azul</title><style>body{margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh}img{max-width:90%;max-height:90vh}</style></head><body><img src="${d}" onload="setTimeout(()=>print(),200)"></body></html>`);w.document.close();});}
window.addEventListener('load',gerar);gerar();
</script></body></html>
